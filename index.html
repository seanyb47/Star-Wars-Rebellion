<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent, with viewport-fit=cover above: the page runs the
         full height of the screen and iOS reports a real safe-area inset for
         the status bar, which the chrome pads itself by. With "black" the
         inset came back as zero on a full-bleed view and the clock landed on
         top of the Crown's name. A web app cannot hide the status bar — only
         a native one can — so the next best thing is that it sits on the
         banner's own painting rather than on a black strip. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seven Seas" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Master of the Seven Seas</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      A shell that outlived its bundle heals itself, once.

      Sean, 19 September: *"A previously-installed (PWA) session throws 404s on
      load... Returning users could hit failed asset loads until a hard
      refresh."* There is no service worker here and never has been, so nothing
      is precaching. What goes stale is this document: an installed standalone
      app holds it, it names its script by content hash, and the next deploy
      deletes the hash it is naming.

      When that happens nothing of the app runs, so nothing in the app can fix
      it — the recovery has to be inline and has to come before the module. One
      reload with a cache-busting query is enough to fetch fresh HTML, and the
      sessionStorage guard means a genuine outage shows an error rather than a
      reload loop.
    -->
    <script>
      (function () {
        var KEY = 'seven-seas.rescued';
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, '1');
            } catch (err) {
              return;
            }
            location.replace(location.pathname + '?rebuilt=' + Date.now());
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
